<!DOCTYPE html>
<html lang="zh-CN">Builder
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带钢浪形检测系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin-top: 30px;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #007bff;
            color: white;
        }
        .btn {
            margin-right: 10px;
        }
        .video-preview {
            max-width: 100%;
            max-height: 400px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .result-table {
            max-height: 400px;
            overflow-y: auto;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .status-running {
            background-color: #28a745;
        }
        .status-stopped {
            background-color: #dc3545;
        }
        .analysis-result {
            max-width: 100%;
            max-height: 400px;
            border: 1px solid #ddd;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">带钢浪形检测系统</h1>
        
        <!-- 视频选择 -->
        <div class="card">
            <div class="card-header">
                视频文件选择
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="videoPath" class="form-label">视频文件路径</label>
                    <input type="text" class="form-control" id="videoPath" placeholder="输入视频文件路径">
                    <small class="form-text text-muted">例如: data/工作侧有单边浪.mp4</small>
                </div>
                <button id="previewBtn" class="btn btn-primary">预览视频</button>
                <button id="startBtn" class="btn btn-success">开始检测</button>
                <button id="stopBtn" class="btn btn-danger">停止检测</button>
                <div id="previewContainer" class="mt-4">
                    <!-- 视频预览将显示在这里 -->
                </div>
            </div>
        </div>
        
        <!-- 检测状态 -->
        <div class="card">
            <div class="card-header">
                检测状态
            </div>
            <div class="card-body">
                <div id="statusDisplay">
                    <span class="status-indicator status-stopped"></span> 未启动
                </div>
                <div id="statusInfo" class="mt-2">
                    <!-- 状态信息将显示在这里 -->
                </div>
            </div>
        </div>
        
        <!-- 检测结果 -->
        <div class="card">
            <div class="card-header">
                检测结果
            </div>
            <div class="card-body">
                <button id="refreshResultsBtn" class="btn btn-primary mb-3">刷新结果</button>
                <div class="result-table">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>时间戳</th>
                                <th>浪形类型</th>
                                <th>浪形等级</th>
                                <th>浪高(mm)</th>
                                <th>浪宽(mm)</th>
                                <th>位置X(mm)</th>
                                <th>位置Y(mm)</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTableBody">
                            <!-- 结果将显示在这里 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- 单帧分析 -->
        <div class="card">
            <div class="card-header">
                单帧分析
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="imagePath" class="form-label">图像文件路径</label>
                    <input type="text" class="form-control" id="imagePath" placeholder="输入图像文件路径">
                </div>
                <button id="analyzeBtn" class="btn btn-primary">分析图像</button>
                <div id="analysisResult" class="mt-4">
                    <!-- 分析结果将显示在这里 -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 预览视频
        document.getElementById('previewBtn').addEventListener('click', function() {
            const videoPath = document.getElementById('videoPath').value;
            if (!videoPath) {
                alert('请输入视频文件路径');
                return;
            }
            
            fetch(`/api/preview?video_path=${encodeURIComponent(videoPath)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const previewContainer = document.getElementById('previewContainer');
                        previewContainer.innerHTML = `<img src="${data.preview_url}" class="video-preview" alt="视频预览">`;
                    } else {
                        alert(data.message);
                    }
                })
                .catch(error => {
                    console.error('预览失败:', error);
                    alert('预览失败');
                });
        });
        
        // 开始检测
        document.getElementById('startBtn').addEventListener('click', function() {
            const videoPath = document.getElementById('videoPath').value;
            if (!videoPath) {
                alert('请输入视频文件路径');
                return;
            }
            
            fetch('/api/start', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ video_path: videoPath })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('检测已开始');
                    updateStatus();
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('启动失败:', error);
                alert('启动失败');
            });
        });
        
        // 停止检测
        document.getElementById('stopBtn').addEventListener('click', function() {
            fetch('/api/stop', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('检测已停止');
                    updateStatus();
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('停止失败:', error);
                alert('停止失败');
            });
        });
        
        // 刷新结果
        document.getElementById('refreshResultsBtn').addEventListener('click', function() {
            fetch('/api/results')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        updateResultsTable(data.data);
                    } else {
                        alert(data.message);
                    }
                })
                .catch(error => {
                    console.error('获取结果失败:', error);
                    alert('获取结果失败');
                });
        });
        
        // 分析图像
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            const imagePath = document.getElementById('imagePath').value;
            if (!imagePath) {
                alert('请输入图像文件路径');
                return;
            }
            
            fetch('/api/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image_path: imagePath })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const analysisResult = document.getElementById('analysisResult');
                    analysisResult.innerHTML = `
                        <div class="row">
                            <div class="col-md-6">
                                <h4>分析结果</h4>
                                <p>浪形类型: ${data.result.wave_type}</p>
                                <p>浪形等级: ${data.result.wave_level}</p>
                                <p>浪高: ${data.result.wave_height} mm</p>
                                <p>浪宽: ${data.result.wave_width} mm</p>
                                <p>位置X: ${data.result.wave_position.x || 0} mm</p>
                                <p>位置Y: ${data.result.wave_position.y || 0} mm</p>
                            </div>
                            <div class="col-md-6">
                                <h4>可视化结果</h4>
                                <img src="${data.visualization_url}" class="analysis-result" alt="分析结果">
                            </div>
                        </div>
                    `;
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('分析失败:', error);
                alert('分析失败');
            });
        });
        
        // 更新状态
        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    const statusDisplay = document.getElementById('statusDisplay');
                    const statusInfo = document.getElementById('statusInfo');
                    
                    if (data.status === 'success') {
                        const status = data.data;
                        if (status.running) {
                            statusDisplay.innerHTML = '<span class="status-indicator status-running"></span> 运行中';
                            statusInfo.innerHTML = `
                                <p>处理帧率: ${status.fps || 0} FPS</p>
                                <p>已处理帧: ${status.processed_frames || 0}</p>
                                <p>检测结果: ${status.detections || 0}</p>
                            `;
                        } else {
                            statusDisplay.innerHTML = '<span class="status-indicator status-stopped"></span> 已停止';
                            statusInfo.innerHTML = '<p>检测已停止</p>';
                        }
                    } else {
                        statusDisplay.innerHTML = '<span class="status-indicator status-stopped"></span> 未启动';
                        statusInfo.innerHTML = '<p>检测未启动</p>';
                    }
                })
                .catch(error => {
                    console.error('获取状态失败:', error);
                });
        }
        
        // 更新结果表格
        function updateResultsTable(results) {
            const tableBody = document.getElementById('resultsTableBody');
            tableBody.innerHTML = '';
            
            if (results.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center">暂无结果</td></tr>';
                return;
            }
            
            // 只显示最新的20条结果
            const latestResults = results.slice(-20);
            
            latestResults.forEach(result => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${new Date(result.timestamp * 1000).toLocaleString()}</td>
                    <td>${result.wave_type}</td>
                    <td>${result.wave_level}</td>
                    <td>${result.wave_height}</td>
                    <td>${result.wave_width}</td>
                    <td>${result.wave_position_x}</td>
                    <td>${result.wave_position_y}</td>
                `;
                tableBody.appendChild(row);
            });
        }
        
        // 定期更新状态
        setInterval(updateStatus, 2000);
        
        // 初始化
        updateStatus();
    </script>
</body>
</html>
