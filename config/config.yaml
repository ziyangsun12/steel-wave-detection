# 系统配置文件

# 相机配置
camera:
  type: local  # 本地视频文件
  video_path: data/无浪形视频.mp4  # 默认视频路径
  fps: 30  # 帧率
  resolution: [1280, 720]  # 分辨率

# 管道配置
pipeline:
  preprocessing: true  # 是否进行预处理
  detection: true  # 是否进行检测
  visualization: true  # 是否进行可视化
  save_results: true  # 是否保存结果

# 预处理配置
preprocessing:
  dehazing: true  # 是否进行去雾
  denoising: true  # 是否进行降噪
  resize: [640, 480]  # 预处理后分辨率

# 检测配置
detection:
  threshold: 0.5  # 检测阈值
  min_area: 100  # 最小检测面积
  max_area: 10000  # 最大检测面积

# 可视化配置
visualization:
  show_raw: true  # 显示原始视频
  show_dehazed: true  # 显示去雾后视频
  show_contour: true  # 显示轮廓提取
  show_heatmap: true  # 显示热力图
  show_results: true  # 显示检测结果

# 结果保存配置
save:
  enabled: true  # 是否保存结果
  path: results/  # 保存路径
  format: json  # 保存格式

# 系统配置
system:
  debug: false  # 是否启用调试模式
  log_level: info  # 日志级别
  max_frames: 1000  # 最大处理帧数
  batch_size: 1  # 批处理大小
